version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: dingtalk-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: dingtalk_sync
      MYSQL_USER: sync_user
      MYSQL_PASSWORD: sync_pass123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: dingtalk-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
